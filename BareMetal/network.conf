# ========================================================
# WinPE WireGuard Bare-Metal Network Configuration
# ========================================================

# Global Defaults
Adapter=Ethernet0
Default_Mask=255.255.255.0
Default_Gateway=<IP>
Default_DNS=<Optional>

# Central / Concentrator Endpoints
Tunnel=<IP>
Backup=<IP>

# --------------------------------------------------------
# Target Physical Server Profiles
# Note: If Mask, Gateway, or DNS are omitted for a server,
# the Default_Mask, Default_Gateway, and Default_DNS defined
# above will be used. If Default_DNS is also blank, DNS is skipped.
# --------------------------------------------------------

# Server 1
SRV1_Name=<Name>
SRV1_IP=<IP>
SRV1_Mask=<empty or different from default>
SRV1_Gateway=<IP>
SRV1_DNS=<Optional>
SRV1_Config=<WireGuard config file>

# Server 2
SRV2_Name=<Name>
SRV2_IP=<IP>
SRV2_Mask=<empty or different from default>
SRV2_Gateway=<IP>
SRV2_DNS=<Option>
SRV2_Config=<WireGuard config file>

# Server 3
SRV3_Name=<Name>
SRV3_IP=<IP>
SRV3_Mask=<empty or different from default>
SRV3_Gateway=<IP>
SRV3_DNS=<Optional>
SRV3_Config=<WireGuard config file>
